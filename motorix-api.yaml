                    insomnia.test('Expected outcome', () => {
                        insomnia.expect(insomnia.response.code).to.eql(200);
                    	insomnia.expect(jsonBody.message).to.eql("User logged in successfully")
                    	insomnia.expect(jsonBody.userId).to.have.lengthOf(36);
                    	insomnia.expect(cookies).to.have.lengthOf(2);
                    });


                    insomnia.environment.set("userId", jsonBody.userId);

                    insomnia.environment.set("authToken", jsonBody.authToken);

                    insomnia.environment.set("csrfToken", jsonBody.csrfToken);

            settings:
                renderRequestBody: true
                encodeUrl: true
                followRedirects: global
